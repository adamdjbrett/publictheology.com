name: Deploy Eleventy to XMIT

on:
  push:
    branches: ["main", "master"]
  # Rebuild with fresh webmentions (likes/replies/reposts) without a content push.
  # Scheduled and manual runs never send webmentions or IndexNow pings; only pushes do.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "XMIT site/domain override (leave blank for publictheology.com@402)"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-xmit-${{ github.ref }}
  # Queue instead of cancel: a cancelled push run could die after deploy but before sending its
  # webmentions, and the next run would see those posts as already live and never announce them.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      XMIT_SITE: publictheology.com@402
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .cache/ holds the last good webmentions.json and the outbound sent-log. A fresh key per run
      # always saves; restore-keys picks the newest. If webmention.io is down, the restored copy is
      # used, so an outage never blanks the responses on the live site.
      - name: Restore webmention cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: webmentions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: webmentions-

      - name: Fetch webmentions
        id: wm
        continue-on-error: true
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: |
          # The file carries a fetch timestamp, so compare only the mentions themselves.
          digest() { jq -cS .children .cache/webmentions.json 2>/dev/null | sha256sum || true; }
          before=$(digest)
          npm run webmentions:fetch
          echo "changed=$([ "$before" = "$(digest)" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Build Eleventy site
        if: github.event_name != 'schedule' || steps.wm.outputs.changed == 'true'
        run: npm run build

      # Posts to announce (one URL per line in changed-urls.txt), worked out before the deploy while
      # the live site is still the old one:
      #   - new: in the built feed but not the live feed (also catches posts held back by a failed
      #     deploy). The feed is only the newest 20, so it is used for nothing else;
      #   - added/edited in this push: any post file whose page exists in _site/ (any age);
      #   - unpublished in this push (edited to published:false): page gone from _site/ but still
      #     live, so Bridgy Fed and linked sites get told it is gone;
      #   - deleted in this push: always (appended after the _site/ check, which they would fail).
      # --no-renames turns a renamed file into delete-old + add-new.
      - name: List new, edited and deleted post URLs
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          site=https://publictheology.com
          feed_urls() { grep -o "<link href=\"$site/[^\"]*/\"/>" | sed -E 's#<link href="([^"]*)"/>#\1#' | grep -vx "$site/" | sort -u; }
          slugs() { sed -E 's#.*/([0-9]{4}-[0-9]{2}-[0-9]{2}-)?([^/]+)\.md$#\2#'; }
          curl -fsS "$site/feed.xml" | feed_urls > live-urls.txt || : > live-urls.txt
          feed_urls < _site/feed.xml > built-urls.txt
          : > deleted-urls.txt
          {
            comm -13 live-urls.txt built-urls.txt
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git diff --no-renames --name-only --diff-filter=AM "$BEFORE" HEAD -- 'src/posts/*.md' | slugs | while read -r slug; do
                if [ -f "_site/$slug/index.html" ]; then
                  echo "$site/$slug/"
                elif curl -fs -o /dev/null --max-time 20 "$site/$slug/"; then
                  echo "$site/$slug/" >> deleted-urls.txt
                fi
              done
              git diff --no-renames --name-only --diff-filter=D "$BEFORE" HEAD -- 'src/posts/*.md' | slugs | sed "s#.*#$site/&/#" >> deleted-urls.txt
            fi
          } | sort -u > changed-urls.txt
          sort -u deleted-urls.txt >> changed-urls.txt
          cat changed-urls.txt

      - name: Deploy to XMIT (CLI)
        if: github.event_name != 'schedule' || steps.wm.outputs.changed == 'true'
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: |
          if [ -z "$XMIT_KEY" ]; then
            echo "XMIT_KEY secret is not set" >&2
            exit 1
          fi
          # Use manual input when workflow_dispatch triggers this workflow
          SITE_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.site || '' }}"
          if [ -n "$SITE_INPUT" ]; then
            export XMIT_SITE="$SITE_INPUT"
          fi
          if [ -z "$XMIT_SITE" ]; then
            echo "XMIT site/domain not provided. Set repo Variable 'XMIT_SITE' or pass 'site' input." >&2
            exit 1
          fi
          echo "Deploying _site to $XMIT_SITE via XMIT CLI";
          npx -y @xmit.co/xmit "$XMIT_SITE" _site || { echo 'XMIT deploy failed' >&2; exit 1; }

      # Bridgy Fed is in webmention-only mode (it no longer polls the feed), so every new or edited
      # post must be mentioned to https://fed.brid.gy/ to bridge. The script also sends webmentions to
      # sites the post links to, logging sends in .cache/webmention-sent.json. Never fails the job.
      - name: Send webmentions (Bridgy Fed + linked sites)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/send-webmentions.mjs changed-urls.txt

      # IndexNow (Bing, Yandex, Seznam, Naver…). The key is public by protocol: src/public/<key>.txt.
      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          INDEXNOW_KEY: 1c81fbe4141395b40ccc0e32ff7b5edc
        run: |
          [ -s changed-urls.txt ] || { echo "No changed posts"; exit 0; }
          urls=$( (cat changed-urls.txt; echo https://publictheology.com/) | jq -R . | jq -s .)
          jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "publictheology.com", key: $key, keyLocation: "https://publictheology.com/\($key).txt", urlList: $urls}' \
            | curl -sS -w "\nIndexNow HTTP %{http_code}\n" -H "Content-Type: application/json; charset=utf-8" -d @- https://api.indexnow.org/indexnow

      - name: Post-deploy summary
        run: |
          echo "Deployment attempt finished for $XMIT_SITE";
          echo "Visit: https://$XMIT_SITE";
